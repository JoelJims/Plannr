<!doctype html>
<html><body>
<div id="out">running...</div>
<script type="module">
import sqlite3InitModule from '/node_modules/@sqlite.org/sqlite-wasm/dist/index.mjs';
const done = (obj) => { document.getElementById('out').textContent = 'DONE'; window.__spikeResult = obj; };
const log = (...a) => { console.log(...a); };

const LEDGERS = ['1.0','2.0','3.0','4.0','4.1','4.2','5.0','5.1','5.2','6.0','7.0','8.0','9.0','9.1',
  '10.0','10.1','11.0','12.0','13.0','14.0','15.0','20.0','20.3','CUSTOM'];
const REASONS = [
  null, 'Cement bags', 'Daily labour', 'Transport charges',
  'Second lot of 8mm and 12mm TMT bars for the first-floor slab; the site engineer flagged the earlier challan was short by roughly 40kg, so this covers the shortfall too.',
  'Electrical rough-in for the first floor — conduits and back boxes only, no wiring pulled yet. Extra points added in the kitchen and near the staircase beyond the original drawing.',
  'Plumbing fixtures', 'Sand delivery', 'Mason wages', 'Steel rods', 'Paint materials',
];
function row(i) {
  const custom = i % 11 === 0;
  const ledgerCode = custom ? 'CUSTOM' : LEDGERS[i % LEDGERS.length];
  const isUser = i % 5 !== 0;
  const day = new Date(Date.UTC(2025, 0, 1) + i * 43200000); // ~half-day increments
  return {
    amount_paise: 1000 + (i % 500000),
    tx_date: day.toISOString().slice(0, 10),
    by_type: isUser ? 'user' : 'custom',
    by_user_id: isUser ? 1 : null,
    by_label: isUser ? null : 'Relative ' + (i % 7),
    ledger_code: ledgerCode,
    subledger_code: (i % 3 === 0 && !custom) ? LEDGERS[(i + 1) % LEDGERS.length] : null,
    ledger_custom_name: custom ? ('Custom material ' + (i % 13)) : null,
    subledger_custom_name: null,
    reason: REASONS[i % REASONS.length],
    contract_scope: i % 4 === 0 ? 'included' : 'extra',
    contract_stated_paise: i % 4 === 0 ? 2000 + (i % 900000) : null,
    phase: (i % 6) + 1,
    subpart: 'abcdef'[i % 6],
    created_at: day.toISOString().replace('T', ' ').slice(0, 19),
    updated_at: day.toISOString().replace('T', ' ').slice(0, 19),
    deleted_at: null,
    contract_service_id: null,
  };
}

try {
  const sqlite3 = await sqlite3InitModule();
  try { sqlite3.kvvfs.clear('local'); } catch {}

  const resp = await fetch('/.spike4-source.db');
  const bytes = new Uint8Array(await resp.arrayBuffer());
  const tempDb = new sqlite3.oo1.DB(':memory:', 'c');
  const p = sqlite3.wasm.allocFromTypedArray(bytes);
  const rc = sqlite3.capi.sqlite3_deserialize(tempDb.pointer, 'main', p, bytes.length, bytes.length,
    sqlite3.capi.SQLITE_DESERIALIZE_FREEONCLOSE | sqlite3.capi.SQLITE_DESERIALIZE_RESIZEABLE);
  if (rc !== 0) throw new Error('deserialize failed rc=' + rc);

  const kdb = new sqlite3.oo1.JsStorageDb('local');
  const schema = tempDb.selectObjects("SELECT name, sql FROM sqlite_master WHERE type='table' AND sql IS NOT NULL AND name <> 'sqlite_sequence'");
  for (const s of schema) kdb.exec(s.sql);
  const dataTables = [...schema.map((s) => s.name), 'sqlite_sequence'];
  for (const name of dataTables) {
    const rows = tempDb.selectObjects(`SELECT * FROM ${name}`);
    if (!rows.length) continue;
    const cols = Object.keys(rows[0]);
    const insStmt = kdb.prepare(`INSERT INTO ${name} (${cols.join(',')}) VALUES (${cols.map(() => '?').join(',')})`);
    for (const r of rows) insStmt.bind(cols.map((c) => r[c])).stepReset();
    insStmt.finalize();
  }
  tempDb.close();

  const baseline = { bytes: sqlite3.kvvfs.estimateSize('local'), rows: kdb.selectValue('SELECT COUNT(*) FROM cash_out') };
  log('baseline', JSON.stringify(baseline));

  const insCashOut = kdb.prepare(`INSERT INTO cash_out
    (amount_paise, tx_date, by_type, by_user_id, by_label, ledger_code, subledger_code,
     ledger_custom_name, subledger_custom_name, reason, contract_scope, contract_stated_paise,
     phase, subpart, created_at, updated_at, deleted_at, contract_service_id)
    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`);
  const cols = ['amount_paise','tx_date','by_type','by_user_id','by_label','ledger_code','subledger_code',
    'ledger_custom_name','subledger_custom_name','reason','contract_scope','contract_stated_paise',
    'phase','subpart','created_at','updated_at','deleted_at','contract_service_id'];

  function insertBatch(startIdx, count) {
    kdb.exec('BEGIN');
    for (let i = startIdx; i < startIdx + count; i++) {
      const r = row(i);
      insCashOut.bind(cols.map((c) => r[c])).stepReset();
    }
    kdb.exec('COMMIT');
  }

  // Phase 1: insert exactly 5000 rows, measure the marginal rate.
  insertBatch(0, 5000);
  const after5000 = { bytes: sqlite3.kvvfs.estimateSize('local'), rows: kdb.selectValue('SELECT COUNT(*) FROM cash_out') };
  const marginalBytesPerRow = (after5000.bytes - baseline.bytes) / 5000;
  log('after5000', JSON.stringify(after5000), 'marginal', marginalBytesPerRow);

  // Phase 2: keep pushing in batches until it breaks (or a generous safety cap), to see WHAT HAPPENS
  // at the real limit, not just estimate where it is.
  let inserted = 5000;
  let lastGoodSize = after5000.bytes;
  let lastGoodRows = after5000.rows;
  let failure = null;
  const BATCH = 2000;
  const SAFETY_CAP_BYTES = 30 * 1024 * 1024; // 30MB — well past any documented ~5MB kvvfs ceiling
  const SAFETY_CAP_ROWS = 300000;
  const t0 = Date.now();
  while (!failure && lastGoodSize < SAFETY_CAP_BYTES && inserted < SAFETY_CAP_ROWS && (Date.now() - t0) < 8 * 60 * 1000) {
    try {
      insertBatch(inserted, BATCH);
      inserted += BATCH;
      lastGoodSize = sqlite3.kvvfs.estimateSize('local');
      lastGoodRows = kdb.selectValue('SELECT COUNT(*) FROM cash_out');
    } catch (e) {
      failure = { name: e.name, message: e.message, code: e.sqlite3Rc ?? e.code ?? null, insertedBeforeFailure: inserted, sizeBeforeFailure: lastGoodSize };
    }
  }

  // Post-failure integrity check: is the data written BEFORE the failure still intact and readable?
  let postFailureCheck = null;
  if (failure) {
    try {
      const rowsNow = kdb.selectValue('SELECT COUNT(*) FROM cash_out');
      const integrity = kdb.selectValue('PRAGMA integrity_check');
      const sample = kdb.selectObjects('SELECT * FROM cash_out ORDER BY id DESC LIMIT 1')[0];
      postFailureCheck = { rowsNow, integrity, lastRowReadable: !!sample };
    } catch (e2) {
      postFailureCheck = { readFailed: e2.message };
    }
  }

  done({
    baseline, after5000, marginalBytesPerRow,
    pushFurther: { stoppedBecause: failure ? 'error' : (lastGoodSize >= SAFETY_CAP_BYTES ? 'size safety cap' : (inserted >= SAFETY_CAP_ROWS ? 'row safety cap' : 'time cap')),
      totalInsertedAttempted: inserted, lastGoodRows, lastGoodSize, failure, postFailureCheck, elapsedMs: Date.now() - t0 },
  });
} catch (e) {
  done({ ok: false, error: e.message, stack: e.stack });
}
</script>
</body></html>
