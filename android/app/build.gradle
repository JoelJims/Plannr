apply plugin: 'com.android.application'

// Phase 8e — release signing. Credentials live in keystore.properties at the PROJECT root (a
// sibling of this android/ directory, NOT checked in — see .gitignore), never here in build.gradle.
// Read lazily and guarded: a missing properties file (e.g. a fresh checkout with no keystore yet)
// must NOT break debug builds, which never consult signingConfigs.release at all, nor should it
// break `assembleRelease` itself — it just produces an unsigned release APK instead of failing
// Gradle's configuration phase outright.
def projectRootDir = rootProject.file('..')
def keystorePropertiesFile = new File(projectRootDir, 'keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.plannr.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.plannr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile new File(projectRootDir, keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ---- Release APK filename ---------------------------------------------------------------
    // Every one of these apps is a Gradle module called "app", so every one shipped its release
    // build as "app-release.apk". Three of those in one chat or download folder are impossible to
    // tell apart, and the wrong one gets installed. The release output is now named for its app.
    //
    // Two settings, deliberately:
    //   · base.archivesName (below, outside this block) renames the archives this module produces
    //     from "app" to "Plannr" — but AGP always appends the variant name, so on its own that
    //     yields "Plannr-release.apk", not "Plannr.apk".
    //   · outputFileName here drops that suffix, so the file that actually lands is "Plannr.apk".
    //
    // applicationVariants is the deprecated variant API (targeted for removal in AGP 9). Keeping
    // archivesName set is the hedge: if this block ever stops working, the output degrades to
    // "Plannr-release.apk" — still unambiguous — rather than silently reverting to
    // "app-release.apk", which is the exact failure being fixed.
    //
    // DEBUG keeps its variant suffix and becomes "Plannr-debug.apk": only the release output is
    // overridden above, so archivesName renames it and AGP still appends "-debug". Verified by
    // building one. That is the wanted outcome — a debug build is identifiable as this app AND
    // unmistakable for the release.
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                output.outputFileName = "Plannr.apk"
            }
        }
    }
}

// Renames this module's archives from the default "app" to the app's own name; see the note in
// the android block above for why both this and the outputFileName override are set.
base {
    archivesName = "Plannr"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
