// Phase 8b: @capacitor/android and @capacitor/filesystem's own build.gradle files require a Java 21
// toolchain (sourceCompatibility/jvmToolchain(21)) regardless of compileSdkVersion. Only JDK 17 is
// installed here, so let Gradle auto-provision a JDK 21 toolchain instead of requiring a manual install.
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'