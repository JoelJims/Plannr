<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Create account · Plannr</title>
  <link rel="icon" href="/logo.svg">
  <link rel="preload" href="/fonts/chakra-petch-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="hud-frame hud-frame--pulse" aria-hidden="true">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <main class="shell">
    <aside class="brand-panel">
      <div class="brand reveal d1">
        <div class="mark">
          <img src="/logo.svg" alt="" aria-hidden="true">
        </div>
        <div>
          <div class="wordmark">Plannr</div>
          <span class="sub">Construction Ledger</span>
        </div>
      </div>

      <span class="chip reveal d2">Get started</span>
      <p class="tagline reveal d3">Set up your account and start tracking build costs against the <b>budget</b>.</p>
    </aside>

    <section class="form-panel">
      <div class="form-head reveal d2">
        <span class="chip">Register</span>
        <h1>Create account</h1>
        <p>Your display name is what your team will see.</p>
      </div>

      <div id="msg" class="msg" role="alert"></div>

      <form id="registerForm" class="reveal d3" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
                 autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="field">
          <label for="displayName">Display name</label>
          <input id="displayName" name="displayName" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn primary" id="submitBtn">Create account</button>
      </form>

      <p class="switch reveal d4"><span class="chip">Member?</span> <a href="/login.html">Log in</a></p>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script>
    initAuth({
      formId: 'registerForm',
      endpoint: '/api/register',
      bodyFields: ['username', 'displayName', 'password', 'confirmPassword'],
      toggleFields: ['password', 'confirmPassword'],
      matchFields: ['password', 'confirmPassword'],
      matchError: 'Passwords do not match.',
      busyText: 'Creating account…',
      idleText: 'Create account',
      onSuccess: 'message',
      successMessage: 'Account created.',
      successSuffix: ' Head to the login page to sign in.',
      errorFallback: 'Could not create account.',
    });
  </script>
</body>
</html>
