<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Phase 5: local-only mode — no server, no network requests for /api/*. See local-bootstrap.js. -->
  <script type="importmap">
  { "imports": {
      "@sqlite.org/sqlite-wasm": "/node_modules/@sqlite.org/sqlite-wasm/dist/index.mjs",
      "node:fs": "/node-builtins-browser-stub.js",
      "node:path": "/node-builtins-browser-stub.js",
      "node:sqlite": "/node-builtins-browser-stub.js"
  } }
  </script>
  <script type="module" src="/local-bootstrap.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Plannr</title>
  <link rel="icon" href="/logo.svg">
  <link rel="preload" href="/fonts/chakra-petch-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rajdhani-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Plain near-black home background — no blueprint grid, no effect layer.
       (align-items keeps the enlarged group reachable if it exceeds the viewport.) */
    body { background: var(--bg); background-image: none; align-items: safe center; }

    /* ---- Home layout: nav row + enlarged card, centred as a group ----
       Scoped to home only (login/register/date reuse the shared .shell as-is). */
    .home-stack {
      position: relative;
      z-index: 1;               /* content layer, below the HUD frame (z-index 40) */
      width: 100%;
      max-width: 1280px;        /* grown ~1/3 from the shared 960px; nav aligns to this */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .shell--home { max-width: none; } /* fill the stack width so nav + card align */
    @media (min-width: 800px) {
      .shell--home .brand-panel { padding: 58px 40px; } /* vertical padding raised ~1/3 (44 -> 58) */
      .shell--home .form-panel  { padding: 64px 44px; } /*                          (48 -> 64) */
    }

    /* ---- Nav button row ---- */
    .home-nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2x2 on small screens */
      gap: 10px;
    }
    @media (min-width: 800px) {
      .home-nav { grid-template-columns: repeat(4, 1fr); } /* 4 across on desktop */
    }
    .navbtn {
      min-height: 50px;
      padding: 10px 12px;
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.14em;
      line-height: 1.15;
      text-transform: uppercase;
      text-align: center;
      color: var(--accent);
      background: var(--panel);
      border: 1px solid var(--accent-line);
      border-radius: 0;
      cursor: pointer;
      clip-path: polygon(var(--clip) 0, 100% 0, 100% calc(100% - var(--clip)), calc(100% - var(--clip)) 100%, 0 100%, 0 var(--clip));
      transition: background 130ms ease, border-color 130ms ease, color 130ms ease;
    }
    .navbtn:hover {
      background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--panel);
      border-color: var(--accent);
      color: #ffb020;           /* brighter amber (existing hover tone) */
    }
    .navbtn:active { background: var(--panel-2); }
    .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Brand column (the contained Prism box was removed): on desktop the shared
       style anchors the tagline to the bottom to fill space the box used to take —
       with the box gone, group the header content at the top so there's no empty
       gap. Scoped to home only; other pages using .brand-panel are untouched. */
    @media (min-width: 800px) {
      .shell--home .brand-panel .tagline { margin-top: 16px; padding-top: 0; }
    }

  </style>
</head>
<body>
  <div class="hud-frame" aria-hidden="true">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <div class="home-stack">
    <nav class="home-nav" aria-label="Sections">
      <button type="button" class="navbtn" data-target="flow" data-href="/cash-flow.html">Cash flow</button>
      <button type="button" class="navbtn" data-target="overview" data-href="/overview.html">Overview</button>
      <button type="button" class="navbtn" data-target="contract" data-href="/contract-details.html">Contract details</button>
      <button type="button" class="navbtn" data-target="data" data-href="/data-backup.html">Data backup</button>
    </nav>

    <main class="shell shell--home">
      <aside class="brand-panel">
        <div class="brand">
          <div class="mark">
            <img src="/logo.svg" alt="" aria-hidden="true">
          </div>
          <div>
            <div class="wordmark">Plannr</div>
            <span class="sub">Construction Ledger</span>
          </div>
        </div>

        <span class="chip">Session active</span>
        <p class="tagline">You are signed in. Your <b>build ledger</b> lives here.</p>
      </aside>

      <section class="form-panel">
        <div class="welcome">
          <span class="chip">Signed in</span>
          <p class="big">Welcome, <span id="name">…</span></p>
          <p class="lead">Cost tracking is next. For now, you can sign out safely below.</p>
          <!-- Part D — last login (time + IP) and any failed attempts since then. Populated from /api/me;
               built via textContent (CSP-safe). The failed-attempts note is the part that does the work. -->
          <p class="home-lastlogin" id="lastLogin" hidden></p>
        </div>
      </section>
    </main>
  </div>

  <script>
  // Phase 5: local-bootstrap.js (a deferred module) installs the fetch shim before this event fires —
  // see the same note in overview.html/cash-outflow.html/etc. from Phase 4c.
  document.addEventListener('DOMContentLoaded', async () => {
    // Phase 5: DOMContentLoaded does NOT wait for a deferred module's top-level await to settle
    // (verified empirically — it only waits for the module's synchronous portion to run). The
    // <script type="module" src="/local-bootstrap.js"> tag above starts loading it early, but this
    // explicit await is what actually GUARANTEES the fetch shim is installed before the fetch() calls
    // below run — dynamic import() of an already-loading module reuses the same promise, so this
    // costs nothing extra once the tag above has already resolved it.
    await import('/local-bootstrap.js');
    const nameEl = document.getElementById('name');

    fetch('/api/me').then(async (r) => {
      const data = await r.json();
      nameEl.textContent = data.user.displayName;
      renderLastLogin(data);
    });

    // Part D — "last login" line (previous successful login + IP) and, when non-zero, the failed
    // attempts since then. classList/textContent only — CSP-safe (no inline style=).
    function renderLastLogin(data) {
      const el = document.getElementById('lastLogin');
      if (!el) return;
      el.replaceChildren();
      if (data.lastLogin) {
        el.append(document.createTextNode('Last login: ' + data.lastLogin.atIST + (data.lastLogin.ip ? ' · ' + data.lastLogin.ip : '')));
      } else {
        el.append(document.createTextNode('First login — welcome.'));
      }
      const n = data.failedSinceLastLogin || 0;
      if (n > 0) {
        const warn = document.createElement('span');
        warn.className = 'home-fail';
        warn.textContent = ' ⚠ ' + n + ' failed sign-in attempt' + (n === 1 ? '' : 's') + ' since then.';
        el.append(warn);
      }
      // Part D (follow-up) — username-enumeration signal: attempts on usernames that don't exist.
      const u = (data.unknownLoginFailures && data.unknownLoginFailures.sinceLastLogin) || 0;
      if (u > 0) {
        const warn2 = document.createElement('span');
        warn2.className = 'home-fail';
        warn2.textContent = ' ⚠ ' + u + ' attempt' + (u === 1 ? '' : 's') + ' on unknown usernames since then (possible enumeration).';
        el.append(warn2);
      }
      el.hidden = false;
    }

    // Nav buttons: one with a data-href navigates there (Cash Flow -> /cash-flow);
    // the rest are still placeholders (deliberate no-op until their pages exist).
    document.querySelectorAll('.home-nav .navbtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.href) { location.href = btn.dataset.href; return; }
        const target = btn.dataset.target; // "overview" | "contract" | "data"
        // TODO: route to the target page when it exists.
        void target;
      });
    });

  });
  </script>

</body>
</html>
